# Mosquitto 2.x ปิดการเชื่อมต่อจากภายนอกเป็นค่าเริ่มต้น ต้องเปิด listener เอง
listener 1883 0.0.0.0

# โหมดเดโม: ไม่ต้องใช้ username/password
# ถ้าใช้งานจริงควรเปิด password_file + TLS 
allow_anonymous true

# ไฟล์เสริม เช่น bridge ไปยัง public broker สำหรับ Wokwi
include_dir /mosquitto/config/conf.d
